name: Microgame CI

on:
  pull_request:
  push:
    branches:
      - main
      - microgame-engine-v0.1-runtime
      - capture-11
      - critter-flip

permissions:
  contents: read

jobs:
  core:
    name: Typecheck, unit, stress, coverage, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + coverage gate
        run: npm run test:coverage
      - name: Property/stress gate
        run: npm run test:stress
      - name: Production build
        run: npm run build
      - name: Upload verified static build
        uses: actions/upload-artifact@v7
        with:
          name: microgame-web-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Browser E2E + accessibility
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run browser verification
        run: npm run e2e
      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
